    <rect x="244" y="96" width="6" height="6"/><rect x="262" y="96" width="6" height="6"/>
    <rect x="244" y="124" width="6" height="6"/><rect x="262" y="124" width="6" height="6"/>
    <rect x="244" y="152" width="6" height="6"/><rect x="262" y="152" width="6" height="6"/>
    <rect x="244" y="180" width="6" height="6"/><rect x="262" y="180" width="6" height="6"/>
    <rect x="244" y="296" width="6" height="6"/><rect x="262" y="296" width="6" height="6"/>
    <rect x="244" y="324" width="6" height="6"/><rect x="262" y="324" width="6" height="6"/>
    <rect x="244" y="352" width="6" height="6"/><rect x="262" y="352" width="6" height="6"/>
    <rect x="244" y="380" width="6" height="6"/><rect x="262" y="380" width="6" height="6"/>
    <rect x="152" y="232" width="6" height="6"/><rect x="176" y="232" width="6" height="6"/>
    <rect x="200" y="232" width="6" height="6"/><rect x="306" y="232" width="6" height="6"/>
    <rect x="330" y="232" width="6" height="6"/><rect x="354" y="232" width="6" height="6"/>
