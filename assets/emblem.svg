<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cantica">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e3b8ff"/>
      <stop offset="0.45" stop-color="#b07ad4"/>
      <stop offset="1" stop-color="#7a4ca0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="void" cx="50%" cy="50%" r="70%">
