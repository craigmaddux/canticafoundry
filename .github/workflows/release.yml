name: Release

# Push a tag like v0.11.0 to publish a release with system.json and system.zip.
# Foundry (or Molten) installs and updates from:
#   https://github.com/craigmaddux/canticafoundry/releases/latest/download/system.json

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the tests
        run: node --test test/*.test.mjs

      - name: Stamp version and URLs into system.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" \
             --arg url "https://github.com/${REPO}" \
             --arg manifest "https://github.com/${REPO}/releases/latest/download/system.json" \
             --arg download "https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}/system.zip" \
             '.version = $v | .url = $url | .manifest = $manifest | .download = $download' \
             system.json > system.tmp && mv system.tmp system.json

      - name: Bundle the lore (ledger entries and Station Briefs; the system ships no art)
        run: node scripts/bundle-lore.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the compendium packs (Rules, Lore, One-Shots)
        run: |
          npm ci
          node scripts/build-packs.mjs

      - name: Build system.zip
        run: zip -r system.zip system.json cantica.mjs module templates styles lang samples lore packs

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            system.json
            system.zip
          generate_release_notes: true
